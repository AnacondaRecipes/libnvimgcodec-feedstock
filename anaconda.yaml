      url: https://api.anaconda.org/package/conda-forge/libnvimgcodec
      regex: '"version":\s*"([^"]+)"'
    packages:
      - libnvimgcodec-dev
      - libnvimgcodec
      - libnvimgcodec-libjpeg-turbo-ext
